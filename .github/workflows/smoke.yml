name: smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: bash tests/smoke.sh --image python:3.11-bookworm
  local:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: bash tests/smoke.sh --local
